name: Attest

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - run: git -C lib/aave-address-book submodule update --init lib/aave-v4
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
      - run: forge test

  attest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        config: [attest.toml, attest.child-a.toml]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: crossecute/forge-attest@9e76385ac2f96f171ceb9391cf9e8298e2d408cf # v1.4.0
        with:
          config: ${{ matrix.config }}

  attest-capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: crossecute/forge-attest@9e76385ac2f96f171ceb9391cf9e8298e2d408cf # v1.4.0
        env:
          MAINNET_RPC_URL: https://eth.drpc.org
        with:
          config: attest.capture.toml
          foundry-version: v1.8.1
          require-live: "true"
